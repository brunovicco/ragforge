name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Project quality gate
        run: uv run python scripts/quality_gate.py

  # A `bench-replay` job belongs here and is deliberately absent (ADR-0020).
  # ADR-0004's `make bench` replays a versioned LLM call cache; that replay
  # layer does not exist yet, so `make bench` fails closed and a job invoking
  # it today would only assert the absence of the feature. The job ships in
  # the same change as the replay implementation, and must run without
  # provider credentials in its environment so a cache miss cannot silently
  # fall through to a live call.
